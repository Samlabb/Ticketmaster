server:
  port: 8080

spring:
  application:
    name: gateway-service

  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    gateway:
      routes:
        - id: event-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/events/**

        - id: booking-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/bookings/**

        - id: payment-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/payments/**

        - id: user-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/users/**

        - id: analytics-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/analytics/**

        - id: legacy-ping
          uri: http://localhost:8081
          predicates:
            - Path=/ping

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

management:
  endpoints:
    web:
      exposure:
        include: "*"