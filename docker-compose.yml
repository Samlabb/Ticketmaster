
networks:
  ticketing-network:
    driver: bridge

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile

x-app-environment: &app-environment
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

x-database-environment: &database-environment
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ticketing_db}
  SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin}
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ticketing_dev}

volumes:
  postgres-data:
  redis-data:
  clickhouse-data:
  prometheus-data:
  grafana-data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: ticket-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticketing_db}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketing_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ticketing-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-ticketing_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ticket-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ticketing-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ticket-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - ticketing-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ticket-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - ticketing-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 15s
      timeout: 10s
      retries: 5

  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: ticket-kafdrop
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9005:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:29092
    networks:
      - ticketing-network


  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: ticket-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
      - "9001:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    networks:
      - ticketing-network
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: ticket-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - ticketing-network

  grafana:
    image: grafana/grafana:10.2.0
    container_name: ticket-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - ticketing-network

  event-service:
    build:
      <<: *app-build
      args:
        MODULE: event-service
    container_name: ticket-event-service
    environment:
      <<: [*app-environment, *database-environment]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - ticketing-network
    restart: unless-stopped

  booking-service:
    build:
      <<: *app-build
      args:
        MODULE: booking-service
    container_name: ticket-booking-service
    environment:
      <<: [*app-environment, *database-environment]
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8082:8082"
    networks:
      - ticketing-network
    restart: unless-stopped

  payment-service:
    build:
      <<: *app-build
      args:
        MODULE: payment-service
    container_name: ticket-payment-service
    environment:
      <<: *app-environment
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    networks:
      - ticketing-network
    restart: unless-stopped

  user-service:
    build:
      <<: *app-build
      args:
        MODULE: user-service
    container_name: ticket-user-service
    environment:
      <<: [*app-environment, *database-environment]
      JWT_SECRET: ${JWT_SECRET:-ticketmaster-local-dev-secret-key-change-me-32bytes}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8084:8084"
    networks:
      - ticketing-network
    restart: unless-stopped

  analytics-service:
    build:
      <<: *app-build
      args:
        MODULE: analytics-service
    container_name: ticket-analytics-service
    environment:
      <<: *app-environment
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8085"
    networks:
      - ticketing-network
    restart: unless-stopped

  gateway-service:
    build:
      <<: *app-build
      args:
        MODULE: gateway-service
    container_name: ticket-gateway-service
    environment:
      SPRING_DATA_REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-ticketmaster-local-dev-secret-key-change-me-32bytes}
      EVENT_SERVICE_URL: http://event-service:8081
      BOOKING_SERVICE_URL: http://booking-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8083
      USER_SERVICE_URL: http://user-service:8084
      ANALYTICS_SERVICE_URL: http://analytics-service:8085
    depends_on:
      redis:
        condition: service_healthy
      event-service:
        condition: service_started
      booking-service:
        condition: service_started
      payment-service:
        condition: service_started
      user-service:
        condition: service_started
      analytics-service:
        condition: service_started
    ports:
      - "8080:8080"
    networks:
      - ticketing-network
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: ticket-frontend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - gateway-service
    ports:
      - "5500:80"
    networks:
      - ticketing-network
    restart: unless-stopped